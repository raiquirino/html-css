<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<!--    
• input:radio - para marcar uma opção ou outra coloque o mesmo nome nos elementos assim quando clicar em um o outro será desmarcado
• checked - para que o item já venha marcado
• value - no radio é preciso usar para dar certo

-->
<body>
    <h1>Exemplo de formulário</h1>

    <form action="cadastro.php" method="get"></form>
    <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="isexmas" value="m"><label for="isexmas">Masculino</label>
        
        <input type="radio" name="sexo" id="isexfen" value="f" checked> <label for="isexfen">Feminino</label>

    </fieldset>
    <fieldset>
        <legend>Esportes Favoritos</legend>
        <input type="checkbox" name="esbas" id="iesbass"> <label for="iesbass">Basquete</label><br>
        <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label><br><label for="iesfut">   
        <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label>
        </label><br>
        <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tênis</label><br>
    </fieldset>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    
</body>
</html>
