<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<style>

    body {
        background: url(fundo\ form010.jpg) no-repeat;
    }

    h1 {
        padding-left: 10px;
    }

    fieldset {
        width: 50%;
        height: 50%;
        border: 2px solid black;
        margin: 10px;
        background-color:white;
    }
    input {
        border: 2px solid black;

        
    }

    p#acao {
        margin: 5px 0px 0px 10px;

    }

    p#acao>input{
        background-color: black;
        color: white;
    }

    #lbidade, #iidade h1 {
        font-weight: bolder;
    }



    #botao:hover{
        transform: translate(-3px, -3px);
        transition: transform .4s, border 1s;
        background-color: rgb(19, 64, 117);
        color: white;
    }
</style>
<body>
    <h1>Calcule sua idade</h1>

    <form action="cadastro.php">


        <fieldset>
            <p>
                <label for="iano" id="lbidade">Digite o ano do seu nascimento:</label>
                <input type="number" name="ano" id="iano" min="1930" max="2025" oninput="calcidade()">
            </p>
            <label for="iidade" id="lbidade">Sua idade é:</label>
            <output name="idade" id="iidade">0</output>
        </fieldset>

        <p id="acao">
            <input type="submit" value="Enviar" id="botao">
            <input type="reset" value="Limpar" id="botao">
        </p>
    </form>
<script>
    function calcidade(){
        let atual = new Date().getFullYear()
        iidade.innerHTML = Number(atual) - Number(iano.value)
    }
</script>
    
</body>
</html>
