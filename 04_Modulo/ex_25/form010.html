<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<style>


    body {
        background-image: linear-gradient(hsl(44, 51%, 66%) #FEFCED);

    }

    h1 {
    margin: 0;
    text-align: center;
    font-weight: bolder;
    text-shadow: 3px 3px 10px rgb(215, 211, 211);

    }
 
    main {
        background: url('fundo form010.jpg') no-repeat;
        background-size: cover; /* ajusta a imagem ao tamanho do main */
        max-width: 700px;
        width: 100%;
        height: 516px; /* ou use min-height se quiser garantir altura mínima */
        margin: 0 auto;
        display: block;

    }

    fieldset {
        width: 450px;
        height: 130px;
        border: 2px solid black;
        margin: auto;
        background-color:white;
    }
    input {
        border: 2px solid black;
     
    }

    p#acao {
        margin: 5px 0px 0px 50%;

    }

    p#acao>input{
        background-color: black;
        color: white;
    }

    #lbidade, #iidade{
        font-weight: bolder;
        font-size: 1.5em;
    }



    #botao:hover{
        transform: translate(-3px, -3px);
        transition: transform .4s, border 1s;
        background-color: rgb(19, 64, 117);
        color: white;
    }
</style>
<body>
    <main>

        <h1>Calcule sua idade</h1>

        <form action="cadastro.php">
            <fieldset>
                <p>
                    <label for="iano" id="lbidade">Digite o ano do seu nascimento:</label>
                    <input type="number" name="ano" id="iano" min="1930" max="2025" oninput="calcidade()">
                </p>
                <label for="iidade" id="lbidade">Sua idade é:</label>
                <output name="idade" id="iidade">0</output>
                <p id="acao">
                    <input type="reset" value="Limpar" id="botao">
                </p>
            </fieldset>
        </form>
        <script>
        function calcidade(){
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
        </script>
        
    </main>
</body>
</html>
