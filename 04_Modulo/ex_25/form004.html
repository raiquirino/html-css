<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

    <!--
        Estudar expressoes regulares sobre RegEx

        pattern="" = usado para expressão regular
        toda expressão regular come com um ^ e termina$
        \d ou 0-9 = ler digitos
        {} = Usado pra identificar a quantidade de digitos

    -->

<style>
    fieldset {
        height: 150px;
        width: 300px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        background-color: lightgrey;
    }
</style>
<body>
    <h1>Exemplo de formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required placeholder="Seu nome">
            </p>
            <p>
                <label for="iemail">E-mail:</label>
                <input type="email" name="e-mail" id="iemail" required autocomplete="email" placeholder="seu e-mail">
            </p>
            <p>
                <label for="itel">Telefone:</label>
                <input type="tel" name="Tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required  placeholder="(xx) xxxx-xxxx">
            </p>
            
        </fieldset>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
    </form>
    
</body>
</html>
