<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>

    <!---
    • required - não deixa enviar sem digitar
    • minlenght - minimo de carácteres
    • maxlenght - máximo de caracteres
    • size - quantidade de caracteres mostrados na caixa
    • placeholder - dá dicas do que o usuário deve fazer
    • autocomplete - ajuda na digitação das infomrmações podendo ser colocada individualmente nas caixas
    -->

    <form action="cadastro.php" method="POST" autocomplete="on">
    <p>
        <label for="iusu">Usuário:</label>
        <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="10" placeholder="Digite seu usuário" autocomplete="username">    
    </p>

    <p>
        <label for="isen">Senha</label>
        <input type="password" name="sen" id="isen" required minlength="8" size="8" placeholder="minimo de 8 letras" autocomplete="current-password">
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>

    </form>
    
</body>
</html>
