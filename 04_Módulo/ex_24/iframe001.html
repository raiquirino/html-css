<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
</head>
<!--CSS são sobrenas-->
<style>
    iframe {
        
        width: 300px;
        height: 150px;
        border: 1px solid black;
    }
</style>
<body>
    <h1> Testando o uso de um iframe</h1>
    <p> 
        <!-- 
        Tamanho padrão de um iframe 300px x 150px 
         -->
        Acessando o site do 
        <iframe src="https://www.cursoemvideo.com/" frameborder="1" width="600px" height="300px", scoling="no"></iframe>
        curso em video para aprender a programar
        <!--
        Scoling="xx"
        • Auto = caso seja maior que iframe terá barra lateral.
        • Yes = sempre terá a barra lateral.
        • No = não terá barra lateral (a depender do navegador).
        -->
    </p>

        <p>
        O site do  <iframe src="https://google.com/" frameborder="0"><a href="https:/google.com/" target="_blank">google</a></iframe> também é muito legal
    </p>

    <p>
        O site do google <iframe src="https://gustavoguanabara.github.io/" frameborder="0"></iframe> também é muito legal
    </p>
    
</body>
</html>
