<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;

    }

    table {
        border-collapse: collapse;
        width: 300PX;
    }

    td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
    }

</style>

<body>
    <h1>
        Mesclagem de celúlas
    </h1>
    
    <table>
        <!--
        Em mesclagem
        - colspan mescla coluna 
        - rowspan mescla linha

        é importante entender o que é a linha e o que é a coluna para não ocorrer erros
        
        -->
        <tr>
            <td>A</td>
            <td colspan="2">B</td> 
        </tr>
        
        
        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td>F</td>
        </tr>
            
        <tr>
            <td>H</td>
            <td>I</td>
        </tr>

        <tr>
            <td>L</td>
            <td>M</td>
        </tr>

    </table>

</body>
</html>
